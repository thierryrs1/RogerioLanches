<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Logo Rogério Lanches e Porções">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE047" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#E59800" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Outer Gold Badge Circle -->
  <circle cx="200" cy="200" r="192" fill="url(#goldGrad)" />
  
  <!-- Main Black Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#darkGrad)" />
  
  <!-- Inner Decorative Gold Ring -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.9" />

  <!-- Minimalist Line-Art Burger Icon (Faithful to Official Brand) -->
  <g transform="translate(0, -6)" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Top Bun Dome (with break for artistic highlight like original) -->
    <path d="M 142 114 A 60 50 0 0 1 258 114 L 142 114 Z" />
    <path d="M 164 82 A 46 36 0 0 1 228 79" stroke-width="4.5" opacity="0.85" />
    
    <!-- Upper Cheese / Patty Layer -->
    <rect x="140" y="124" width="120" height="13" rx="6.5" />
    
    <!-- Wavy Lettuce / Melted Cheese Middle Layer -->
    <path d="M 142 146 Q 157 137 171 146 T 200 146 T 229 146 T 258 146" stroke-width="6" />
    
    <!-- Main Burger Patty -->
    <rect x="140" y="155" width="120" height="14" rx="7" />
    
    <!-- Bottom Bun -->
    <path d="M 146 170 L 254 170 A 18 16 0 0 1 236 186 L 164 186 A 18 16 0 0 1 146 170 Z" />
  </g>

  <!-- Main Brand Name: ROGÉRIO -->
  <text x="200" y="256"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Oswald', 'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
        font-size="68"
        font-weight="800"
        letter-spacing="3"
        filter="url(#softGlow)">ROGÉRIO</text>

  <!-- Decorative Side Lines + LANCHES E -->
  <line x1="88" y1="291" x2="120" y2="291" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <text x="200" y="299"
        text-anchor="middle"
        fill="url(#goldGrad)"
        font-family="'Oswald', 'Bebas Neue', 'Arial Narrow', sans-serif"
        font-size="25"
        font-weight="700"
        letter-spacing="3.5">LANCHES E</text>
  <line x1="280" y1="291" x2="312" y2="291" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- PORÇÕES -->
  <text x="200" y="334"
        text-anchor="middle"
        fill="url(#goldGrad)"
        font-family="'Oswald', 'Bebas Neue', 'Arial Narrow', sans-serif"
        font-size="26"
        font-weight="700"
        letter-spacing="3.5">PORÇÕES</text>
</svg>

